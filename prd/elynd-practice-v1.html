<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Elynd Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      body {
        background: #faf9f6;
        color: #1c1917;
        font-family: Inter, 'Noto Sans SC', sans-serif;
      }
      .serif {
        font-family: 'Noto Serif SC', serif;
      }
      .item {
        transition: 0.3s;
      }
      .item:hover {
        transform: translateY(-3px);
      }
      .fade {
        animation: fade 0.6s ease;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="min-h-screen p-10 fade">
      <header class="max-w-5xl mx-auto flex justify-between items-center">
        <div>
          <div class="text-sm text-orange-700 mb-2">学习完成</div>
          <h1 class="serif text-4xl font-bold">The Hidden World of Oceans</h1>
          <p class="text-stone-500 mt-2">15分钟学习记录 · 阅读 + 听力</p>
        </div>

        <div class="w-12 h-12 rounded-full bg-orange-100 flex items-center justify-center">
          <i data-lucide="sparkles" class="text-orange-700"></i>
        </div>
      </header>

      <main class="max-w-5xl mx-auto mt-10 grid grid-cols-3 gap-8">
        <section class="col-span-2">
          <div class="bg-[#F3EEE2] rounded-[32px] p-8">
            <div class="flex items-center gap-3 mb-6">
              <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center">
                <i data-lucide="bot" class="text-orange-700"></i>
              </div>
              <div>
                <div class="font-semibold">Elynd Coach</div>
                <div class="text-xs text-stone-500">你的学习伙伴</div>
              </div>
            </div>

            <p class="text-lg leading-relaxed">
              很好 Joey，我们刚刚阅读了关于海洋的文章。 现在花几分钟确认一下，你是否真正理解了这部分内容。
            </p>
          </div>

          <div class="mt-8 bg-white border rounded-[32px] p-8 item">
            <div class="flex justify-between">
              <div class="text-sm text-orange-700">阶段 1 · 理解</div>
              <div class="text-sm text-stone-500">1 / 3</div>
            </div>

            <h2 class="serif text-2xl font-bold mt-5">What is the main idea of this article?</h2>

            <div class="mt-6 space-y-3">
              <button class="w-full text-left p-4 rounded-xl bg-stone-50 hover:bg-orange-50">
                A. Ocean animals are dangerous
              </button>

              <button class="w-full text-left p-4 rounded-xl bg-stone-50 hover:bg-orange-50">
                B. Oceans contain a huge unknown world
              </button>

              <button class="w-full text-left p-4 rounded-xl bg-stone-50 hover:bg-orange-50">
                C. Scientists stopped exploring oceans
              </button>
            </div>
          </div>

          <div class="mt-8 bg-white border rounded-[32px] p-8">
            <div class="text-sm text-orange-700">阶段 2 · 词汇</div>

            <h2 class="serif text-3xl font-bold mt-4">mystery</h2>

            <p class="text-stone-500 mt-2">请选择这个单词在文章中的含义</p>

            <div class="grid grid-cols-2 gap-4 mt-6">
              <div class="p-4 rounded-xl bg-stone-50">秘密</div>
              <div class="p-4 rounded-xl bg-stone-50">速度</div>
              <div class="p-4 rounded-xl bg-stone-50">颜色</div>
              <div class="p-4 rounded-xl bg-stone-50">声音</div>
            </div>
          </div>
        </section>

        <aside>
          <div class="bg-white border rounded-[32px] p-7 sticky top-10">
            <div class="flex items-center gap-3 mb-8">
              <i data-lucide="target" class="text-orange-700"></i>
              <div class="font-semibold">今日目标</div>
            </div>

            <div class="space-y-5">
              <div>
                <div class="flex justify-between text-sm">
                  <span>阅读</span>
                  <span>✓</span>
                </div>
              </div>

              <div>
                <div class="flex justify-between text-sm">
                  <span>听力</span>
                  <span>✓</span>
                </div>
              </div>

              <div>
                <div class="flex justify-between text-sm">
                  <span>练习</span>
                  <span>进行中</span>
                </div>
              </div>
            </div>

            <button class="mt-10 w-full bg-orange-700 text-white rounded-xl py-3 flex justify-center gap-2">
              <i data-lucide="message-circle"></i>
              开始 AI 对话
            </button>
          </div>
        </aside>
      </main>

      <footer class="max-w-5xl mx-auto mt-10">
        <button class="w-full bg-orange-700 text-white rounded-2xl py-4 flex justify-center items-center gap-2">
          <i data-lucide="check-circle"></i>
          完成今日学习
        </button>
      </footer>
    </div>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
