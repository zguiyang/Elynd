<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>设置新密码 — Elynd</title>
    <meta name="description" content="通过邮件链接设置新密码，提交后直接进入系统。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              canvas: '#FAF9F6',
              paper: '#F3EEE2',
              ink: '#1C1917',
              brand: { DEFAULT: '#C2410C', soft: '#FFF7ED', muted: '#9A3412' },
            },
            fontFamily: {
              sans: ['"Source Sans 3"', '"Noto Sans SC"', 'sans-serif'],
              serif: ['"Noto Serif SC"', 'serif'],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --canvas: #faf9f6;
        --paper: #f3eee2;
        --ink: #1c1917;
        --brand: #c2410c;
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      }
      body {
        background: var(--canvas);
        color: var(--ink);
        font-family: 'Source Sans 3', 'Noto Sans SC', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .serif {
        font-family: 'Noto Serif SC', serif;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
      .field-input {
        width: 100%;
        height: 2.75rem;
        border-radius: 0.85rem;
        border: 1px solid rgb(231 229 228);
        background: #fff;
        padding: 0 0.95rem;
        font-size: 0.95rem;
        color: var(--ink);
        outline: none;
        transition:
          border-color 0.25s var(--ease-out),
          box-shadow 0.25s var(--ease-out);
      }
      .field-input:focus {
        border-color: rgb(194 65 12 / 0.45);
        box-shadow: 0 0 0 3px rgb(194 65 12 / 0.12);
      }
      .field-input::placeholder {
        color: #a8a29e;
      }
    </style>
    <!--
      Reset flow (simple):
      1) Forgot page → email with link ?token=...
      2) This page → set new password
      3) Submit → session created, go straight into app (no success page)
    -->
  </head>
  <body class="relative min-h-screen overflow-x-hidden">
    <div class="relative z-10 min-h-screen flex flex-col">
      <header class="px-6 md:px-10 pt-7">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
          <a href="./elynd-landing-v1.html" class="flex items-center gap-3" aria-label="Elynd home">
            <span class="w-9 h-9 rounded-xl bg-brand-soft flex items-center justify-center ring-1 ring-brand/10">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#C2410C"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
              </svg>
            </span>
            <span class="font-semibold text-lg tracking-tight">Elynd</span>
          </a>
          <a href="./elynd-auth-sign-in-v1.html" class="text-sm text-stone-600 hover:text-ink transition-colors"
            >登录</a
          >
        </div>
      </header>

      <main class="flex-1 flex items-center justify-center px-6 py-14 md:py-20">
        <div class="w-full max-w-[26rem]">
          <div id="panel-form">
            <div class="mb-10 text-center md:text-left">
              <p class="text-brand text-sm font-medium tracking-[0.16em] uppercase mb-4">设置新密码</p>
              <h1 class="serif text-3xl md:text-4xl font-bold leading-tight tracking-tight">设一个新密码</h1>
              <p class="mt-4 text-stone-600 leading-relaxed">填好提交就进系统，不用再登一遍。</p>
            </div>

            <div
              class="rounded-[1.75rem] bg-white p-7 md:p-8 shadow-[0_20px_50px_-28px_rgba(28,25,23,0.28)] ring-1 ring-stone-900/5"
            >
              <p id="token-hint" class="mb-5 text-xs text-stone-400 font-mono break-all"></p>
              <form id="reset-form" class="space-y-5" action="#" method="post">
                <input type="hidden" id="token" name="token" value="" />
                <div>
                  <label for="password" class="block text-sm font-medium text-ink mb-2">新密码</label>
                  <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    required
                    minlength="8"
                    class="field-input"
                    placeholder="至少 8 位"
                  />
                </div>
                <div>
                  <label for="password-confirm" class="block text-sm font-medium text-ink mb-2">再输入一次</label>
                  <input
                    id="password-confirm"
                    name="passwordConfirm"
                    type="password"
                    autocomplete="new-password"
                    required
                    minlength="8"
                    class="field-input"
                    placeholder="确认新密码"
                  />
                </div>
                <p id="form-error" class="hidden text-sm text-red-700"></p>
                <button
                  type="submit"
                  class="w-full inline-flex items-center justify-center gap-2 bg-brand text-white font-medium px-6 py-3.5 rounded-full transition-all duration-500 hover:bg-brand-muted active:scale-[0.98]"
                >
                  保存并进入
                </button>
              </form>
            </div>
          </div>

          <div id="panel-invalid" class="hidden">
            <div class="mb-10 text-center md:text-left">
              <p class="text-brand text-sm font-medium tracking-[0.16em] uppercase mb-4">链接无效</p>
              <h1 class="serif text-3xl md:text-4xl font-bold leading-tight tracking-tight">这个链接用不了了</h1>
              <p class="mt-4 text-stone-600 leading-relaxed">可能过期了，或者已经用过。回去重新发一封就行。</p>
            </div>
            <a
              href="./elynd-auth-forgot-password-v1.html"
              class="w-full inline-flex items-center justify-center gap-2 bg-brand text-white font-medium px-6 py-3.5 rounded-full transition-all duration-500 hover:bg-brand-muted"
            >
              重新发送链接
            </a>
          </div>
        </div>
      </main>

      <footer class="px-6 pb-8 text-center text-sm text-stone-400">独立开发 · 读自己想读的英语</footer>
    </div>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        const tokenInput = document.getElementById('token');
        const hint = document.getElementById('token-hint');
        const formPanel = document.getElementById('panel-form');
        const invalidPanel = document.getElementById('panel-invalid');
        const form = document.getElementById('reset-form');
        const errorEl = document.getElementById('form-error');

        if (!token) {
          formPanel.classList.add('hidden');
          invalidPanel.classList.remove('hidden');
          return;
        }

        tokenInput.value = token;
        hint.textContent = 'token=' + token;

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          const password = document.getElementById('password').value;
          const confirm = document.getElementById('password-confirm').value;
          if (password !== confirm) {
            errorEl.textContent = '两次密码不一样，再看一眼。';
            errorEl.classList.remove('hidden');
            return;
          }
          errorEl.classList.add('hidden');
          // Prototype: submit resets password + creates session → enter app
          window.location.href = './dashboard.html';
        });
      })();
    </script>
  </body>
</html>
