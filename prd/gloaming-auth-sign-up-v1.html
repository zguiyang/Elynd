<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>注册 — 书灯阅读</title>
    <meta name="description" content="注册 书灯阅读，用真正想读的内容学英语。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              canvas: '#FAF9F6',
              paper: '#F3EEE2',
              ink: '#1C1917',
              brand: { DEFAULT: '#C2410C', soft: '#FFF7ED', muted: '#9A3412' },
            },
            fontFamily: {
              sans: ['"Source Sans 3"', '"Noto Sans SC"', 'sans-serif'],
              serif: ['"Noto Serif SC"', 'serif'],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --canvas: #faf9f6;
        --paper: #f3eee2;
        --ink: #1c1917;
        --brand: #c2410c;
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      }
      body {
        background: var(--canvas);
        color: var(--ink);
        font-family: 'Source Sans 3', 'Noto Sans SC', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .serif {
        font-family: 'Noto Serif SC', serif;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
      .field-input {
        width: 100%;
        height: 2.75rem;
        border-radius: 0.85rem;
        border: 1px solid rgb(231 229 228);
        background: #fff;
        padding: 0 0.95rem;
        font-size: 0.95rem;
        color: var(--ink);
        outline: none;
        transition:
          border-color 0.25s var(--ease-out),
          box-shadow 0.25s var(--ease-out);
      }
      .field-input:focus {
        border-color: rgb(194 65 12 / 0.45);
        box-shadow: 0 0 0 3px rgb(194 65 12 / 0.12);
      }
      .field-input::placeholder {
        color: #a8a29e;
      }
    </style>
    <!--
      Auth prototype — same visual system as gloaming-landing-v1.html
      Fields mirror apps/web SignUpForm (name, username, email, password).
    -->
  </head>
  <body class="relative min-h-screen overflow-x-hidden">
    <div class="relative z-10 min-h-screen flex flex-col">
      <header class="px-6 md:px-10 pt-7">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
          <a href="./gloaming-landing-v1.html" class="flex items-center gap-3" aria-label="书灯阅读home">
            <span class="w-9 h-9 rounded-xl bg-brand-soft flex items-center justify-center ring-1 ring-brand/10">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#C2410C"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
              </svg>
            </span>
            <span class="font-semibold text-lg tracking-tight">书灯阅读</span>
          </a>
          <a href="./gloaming-auth-sign-in-v1.html" class="text-sm text-stone-600 hover:text-ink transition-colors"
            >登录</a
          >
        </div>
      </header>

      <main class="flex-1 flex items-center justify-center px-6 py-14 md:py-20">
        <div class="w-full max-w-[26rem]">
          <div class="mb-10 text-center md:text-left">
            <p class="text-brand text-sm font-medium tracking-[0.16em] uppercase mb-4">注册</p>
            <h1 class="serif text-3xl md:text-4xl font-bold leading-tight tracking-tight">先有个账号，再开始读</h1>
            <p class="mt-4 text-stone-600 leading-relaxed">不复杂。填几项就行——产品还在打磨，但方向是认真的。</p>
          </div>

          <div
            class="rounded-[1.75rem] bg-white p-7 md:p-8 shadow-[0_20px_50px_-28px_rgba(28,25,23,0.28)] ring-1 ring-stone-900/5"
          >
            <form class="space-y-4" action="#" method="post" onsubmit="return false;">
              <div>
                <label for="name" class="block text-sm font-medium text-ink mb-2">显示名</label>
                <input
                  id="name"
                  name="name"
                  type="text"
                  autocomplete="name"
                  class="field-input"
                  placeholder="怎么称呼你"
                />
              </div>
              <div>
                <label for="username" class="block text-sm font-medium text-ink mb-2">用户名</label>
                <input
                  id="username"
                  name="username"
                  type="text"
                  autocomplete="username"
                  class="field-input"
                  placeholder="英文或数字，用于登录标识"
                />
              </div>
              <div>
                <label for="email" class="block text-sm font-medium text-ink mb-2">邮箱</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  class="field-input"
                  placeholder="you@example.com"
                />
              </div>
              <div>
                <label for="password" class="block text-sm font-medium text-ink mb-2">密码</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  class="field-input"
                  placeholder="至少 8 位"
                />
              </div>
              <button
                type="submit"
                class="mt-2 w-full inline-flex items-center justify-center gap-2 bg-brand text-white font-medium px-6 py-3.5 rounded-full transition-all duration-500 hover:bg-brand-muted active:scale-[0.98]"
              >
                创建账号
              </button>
            </form>
          </div>

          <p class="mt-8 text-center text-sm text-stone-500">
            已有账号？
            <a href="./gloaming-auth-sign-in-v1.html" class="text-ink font-medium hover:text-brand transition-colors"
              >登录</a
            >
          </p>
        </div>
      </main>

      <footer class="px-6 pb-8 text-center text-sm text-stone-400">独立开发 · 读自己想读的英语</footer>
    </div>
  </body>
</html>
